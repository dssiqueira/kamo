name: Packs

# Optional packs (A-07, D-019): builds whisper.cpp's CLI per platform, fetches the ggml models,
# optionally builds an LGPL FFmpeg for the "Video compatibility" pack (D-040), and publishes
# them with packs-manifest.json as assets of the rolling `packs` release (a
# prerelease, so electron-updater never mistakes it for an app version). The app downloads
# from there only when the user asks. Manual only: packs change rarely and independently of
# the app.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version (e.g. 1.0.0); the asset names carry it, so old versions stay
        required: true
      whisper:
        # A full commit SHA, never a tag: a moved tag would change what users run with the
        # same pack version. a8d002cfd879315632a579e73f0148d06959de36 is the v1.7.6 release.
        description: whisper.cpp commit to build (full 40-character SHA)
        required: true
        default: a8d002cfd879315632a579e73f0148d06959de36
      ffmpeg:
        # The "Video compatibility" pack (D-040). Empty: not built, and the manifest does not
        # list it. A full commit SHA of FFmpeg (a release tag's commit, e.g. n7.1.x), never a tag.
        description: FFmpeg commit for the compatibility pack (full SHA; empty to skip it)
        required: false
        default: ''

permissions:
  contents: read

env:
  WHISPER_REPO: https://github.com/ggml-org/whisper.cpp
  # Inputs reach the scripts as variables only, never pasted into them.
  WHISPER_COMMIT: ${{ inputs.whisper }}
  PACK_VERSION: ${{ inputs.version }}
  FFMPEG_REPO: https://github.com/FFmpeg/FFmpeg
  FFMPEG_COMMIT: ${{ inputs.ffmpeg }}
  # Only what Kamo runs (apps/desktop/src/main/compat/ffmpeg.ts): raw RGBA frames and s16le
  # sound in, MP4 out, through LGPL encoders. No --enable-gpl and no --enable-nonfree, so no
  # libx264: the build is LGPL-2.1-or-later and can ship next to an MIT app (each job checks
  # it with `ffmpeg -L`).
  FFMPEG_CONFIGURE: >-
    --disable-everything --disable-doc --disable-debug --disable-network
    --disable-ffplay --disable-ffprobe --enable-static --disable-shared
    --enable-protocol=file,pipe
    --enable-demuxer=rawvideo,pcm_s16le --enable-decoder=rawvideo,pcm_s16le
    --enable-encoder=mpeg4,aac --enable-muxer=mp4,null
    --enable-filter=scale,format,aformat,aresample,null,anull
    --enable-bsf=extract_extradata,h264_mp4toannexb

jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        run: |
          [[ "$WHISPER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::whisper must be a full commit SHA"; exit 1; }
          [[ "$PACK_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || { echo "::error::version must look like 1.0.0"; exit 1; }
          [[ -z "$FFMPEG_COMMIT" || "$FFMPEG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ffmpeg must be a full commit SHA (or empty)"; exit 1; }

  windows:
    needs: inputs
    runs-on: windows-latest
    steps:
      - name: Build whisper-cli (x64, CPU, every CPU variant loaded at run time)
        shell: bash
        run: |
          git init -q whisper.cpp
          cd whisper.cpp
          git fetch -q --depth 1 "$WHISPER_REPO" "$WHISPER_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$WHISPER_COMMIT"
          # GGML_NATIVE=OFF: the CI machine's CPU flags must not leak into the build. The CPU
          # backend is built once per instruction set (SSE4.2 … AVX-512) and the best one is
          # picked when it runs, so old and new PCs both work.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release -j --target whisper-cli
          mkdir -p ../pack/win32-x64
          cp build/bin/Release/whisper-cli.exe build/bin/Release/*.dll ../pack/win32-x64/
          ls -la ../pack/win32-x64
      - name: Check it runs
        shell: bash
        run: pack/win32-x64/whisper-cli.exe --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win32-x64
          path: pack/win32-x64

  mac:
    needs: inputs
    runs-on: macos-15
    steps:
      - name: Build whisper-cli (arm64, Metal, static)
        run: |
          git init -q whisper.cpp
          cd whisper.cpp
          git fetch -q --depth 1 "$WHISPER_REPO" "$WHISPER_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$WHISPER_COMMIT"
          # One self-contained binary: Metal shaders embedded, ggml linked in.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release -j --target whisper-cli
          mkdir -p ../pack/darwin-arm64
          cp build/bin/whisper-cli ../pack/darwin-arm64/
          # Apple Silicon only runs signed code: ad-hoc here; the release signing (step 10)
          # can sign it with the app's identity instead.
          codesign --force --sign - ../pack/darwin-arm64/whisper-cli
          otool -L ../pack/darwin-arm64/whisper-cli
      - name: Check it runs
        run: pack/darwin-arm64/whisper-cli --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-arm64
          path: pack/darwin-arm64

  models:
    needs: inputs
    runs-on: ubuntu-latest
    steps:
      # Multilingual models (not `.en`): Kamo transcribes any language Whisper knows.
      # Light = base (148MB): ~10 min of audio well under 5 min on an i5/M1 (A-05).
      # Accurate = small (488MB): clearly better in Portuguese, Chinese and Japanese.
      # SHA-1s from whisper.cpp's models/README.md; a changed file fails the job.
      - name: Download and check the models
        run: |
          mkdir -p models && cd models
          base=https://huggingface.co/ggerganov/whisper.cpp/resolve/main
          curl -fL --retry 3 -o ggml-base.bin "$base/ggml-base.bin"
          curl -fL --retry 3 -o ggml-small.bin "$base/ggml-small.bin"
          echo "465707469ff3a37a2b9b8d8f89f2f99de7299dac  ggml-base.bin" | sha1sum -c -
          echo "55356645c2b361a969dfd0ef2c5a50d530afd8d5  ggml-small.bin" | sha1sum -c -
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models
          path: models

  ffmpeg-windows:
    needs: inputs
    if: inputs.ffmpeg != ''
    runs-on: windows-latest
    env:
      MSYSTEM: MINGW64
      CHERE_INVOKING: '1'
    defaults:
      run:
        # The runner image's own MSYS2 (no third-party action): MinGW-w64 GCC builds FFmpeg.
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - name: Toolchain
        run: pacman -S --noconfirm --needed git make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Build FFmpeg (x64, LGPL, static, Media Foundation H.264)
        run: |
          git init -q ffmpeg
          cd ffmpeg
          git fetch -q --depth 1 "$FFMPEG_REPO" "$FFMPEG_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FFMPEG_COMMIT"
          # No autodetected libraries (a stray libiconv DLL would break the single file); only
          # Windows' own threads and Media Foundation (h264_mf: the OS encoder, LGPL-safe).
          ./configure $FFMPEG_CONFIGURE --disable-autodetect --enable-w32threads \
            --enable-mediafoundation --enable-encoder=h264_mf --extra-ldflags=-static
          make -j"$(nproc)" ffmpeg
          mkdir -p ../pack/ffmpeg-win32-x64
          cp ffmpeg.exe COPYING.LGPLv2.1 ../pack/ffmpeg-win32-x64/
          {
            echo "FFmpeg for the optional Video compatibility pack of Kamo (D-040)."
            echo "License: GNU LGPL 2.1 or later (COPYING.LGPLv2.1). Kamo runs it as a separate program."
            echo "Source: $FFMPEG_REPO/tree/$FFMPEG_COMMIT"
            echo "Built by .github/workflows/packs.yml in https://github.com/$GITHUB_REPOSITORY with:"
            ./ffmpeg.exe -hide_banner -buildconf
          } > ../pack/ffmpeg-win32-x64/NOTICE.txt
      - name: Check the license, the libraries and an encode
        run: |
          cd pack/ffmpeg-win32-x64
          ./ffmpeg.exe -hide_banner -L | grep -q "GNU Lesser General Public" || { echo "::error::not an LGPL build"; exit 1; }
          if ./ffmpeg.exe -hide_banner -buildconf | grep -Eq -- "--enable-(gpl|nonfree)"; then echo "::error::GPL or nonfree parts"; exit 1; fi
          # Only Windows' own DLLs: the pack is one program plus its notices.
          for dll in $(objdump -p ffmpeg.exe | sed -n 's/.*DLL Name: //p'); do
            [ -f "/c/Windows/System32/$dll" ] || { echo "::error::depends on $dll"; exit 1; }
          done
          ./ffmpeg.exe -hide_banner -encoders | grep -q h264_mf
          frames=$((64 * 36 * 4 * 30))
          head -c "$frames" /dev/zero | ./ffmpeg.exe -hide_banner -loglevel error -f rawvideo \
            -pix_fmt rgba -s 64x36 -framerate 30 -i pipe:0 -c:v mpeg4 -q:v 2 -f mp4 check.mp4
          # The runner may have no Media Foundation H.264 encoder: a warning, not a failure.
          head -c "$frames" /dev/zero | ./ffmpeg.exe -hide_banner -loglevel error -f rawvideo \
            -pix_fmt rgba -s 64x36 -framerate 30 -i pipe:0 -vf format=nv12 -c:v h264_mf \
            -f mp4 check-mf.mp4 || echo "::warning::h264_mf did not encode on the runner"
          rm -f check.mp4 check-mf.mp4
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-win32-x64
          path: pack/ffmpeg-win32-x64

  ffmpeg-mac:
    needs: inputs
    if: inputs.ffmpeg != ''
    runs-on: macos-15
    steps:
      - name: Build FFmpeg (arm64, LGPL, VideoToolbox H.264)
        run: |
          git init -q ffmpeg
          cd ffmpeg
          git fetch -q --depth 1 "$FFMPEG_REPO" "$FFMPEG_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FFMPEG_COMMIT"
          # System frameworks only (VideoToolbox: the OS encoder, LGPL-safe), nothing from
          # Homebrew.
          ./configure $FFMPEG_CONFIGURE --arch=arm64 --cc=clang --enable-pthreads \
            --enable-videotoolbox --enable-encoder=h264_videotoolbox \
            --disable-sdl2 --disable-libxcb --disable-xlib --disable-iconv --disable-lzma \
            --disable-bzlib --disable-zlib
          make -j"$(sysctl -n hw.ncpu)" ffmpeg
          mkdir -p ../pack/ffmpeg-darwin-arm64
          cp ffmpeg COPYING.LGPLv2.1 ../pack/ffmpeg-darwin-arm64/
          # Apple Silicon only runs signed code: ad-hoc here, like whisper-cli.
          codesign --force --sign - ../pack/ffmpeg-darwin-arm64/ffmpeg
          {
            echo "FFmpeg for the optional Video compatibility pack of Kamo (D-040)."
            echo "License: GNU LGPL 2.1 or later (COPYING.LGPLv2.1). Kamo runs it as a separate program."
            echo "Source: $FFMPEG_REPO/tree/$FFMPEG_COMMIT"
            echo "Built by .github/workflows/packs.yml in https://github.com/$GITHUB_REPOSITORY with:"
            ./ffmpeg -hide_banner -buildconf
          } > ../pack/ffmpeg-darwin-arm64/NOTICE.txt
      - name: Check the license, the libraries and an encode
        run: |
          cd pack/ffmpeg-darwin-arm64
          ./ffmpeg -hide_banner -L | grep -q "GNU Lesser General Public" || { echo "::error::not an LGPL build"; exit 1; }
          if ./ffmpeg -hide_banner -buildconf | grep -Eq -- "--enable-(gpl|nonfree)"; then echo "::error::GPL or nonfree parts"; exit 1; fi
          # Only the system's own libraries and frameworks.
          if otool -L ffmpeg | tail -n +2 | grep -Ev "^[[:space:]]+(/usr/lib/|/System/Library/)"; then
            echo "::error::links a library outside the system"; exit 1
          fi
          ./ffmpeg -hide_banner -encoders | grep -q h264_videotoolbox
          frames=$((64 * 36 * 4 * 30))
          head -c "$frames" /dev/zero | ./ffmpeg -hide_banner -loglevel error -f rawvideo \
            -pix_fmt rgba -s 64x36 -framerate 30 -i pipe:0 -c:v mpeg4 -q:v 2 -f mp4 check.mp4
          head -c "$frames" /dev/zero | ./ffmpeg -hide_banner -loglevel error -f rawvideo \
            -pix_fmt rgba -s 64x36 -framerate 30 -i pipe:0 -vf format=nv12 -c:v h264_videotoolbox \
            -allow_sw 1 -f mp4 check-vt.mp4 || echo "::warning::h264_videotoolbox did not encode on the runner"
          rm -f check.mp4 check-vt.mp4
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-darwin-arm64
          path: pack/ffmpeg-darwin-arm64

  publish:
    needs: [windows, mac, models, ffmpeg-windows, ffmpeg-mac]
    runs-on: ubuntu-latest
    # The FFmpeg jobs are skipped without the `ffmpeg` input: publish anyway, never after a failure.
    if: github.repository == 'dssiqueira/kamo' && !cancelled() && !failure()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: pack
      - name: Assets and packs-manifest.json (sizes and SHA-256 computed here)
        working-directory: apps/desktop
        run: >
          node scripts/make-packs-manifest.ts ../../pack ../../upload "$PACK_VERSION"
          "https://github.com/$GITHUB_REPOSITORY/releases/download/packs"
      - name: Upload to the `packs` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || gh release create packs --prerelease \
            --title "Optional packs" \
            --notes "Optional packs for the Kamo desktop app (transcription, video compatibility). Downloaded by the app only when you ask for them; see docs/integrations.md."
          # Versioned files first, the manifest last: an app never sees a list whose files are
          # not there yet.
          find upload -type f ! -name packs-manifest.json -print0 | xargs -0 gh release upload packs --clobber
          gh release upload packs upload/packs-manifest.json --clobber
