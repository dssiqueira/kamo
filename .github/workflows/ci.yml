name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      # Every i18n key the code uses exists in the locales (rule 14).
      - run: pnpm i18n:usage
      # Rule 2: no system-wide keyboard capture anywhere in the app or the native helpers.
      - run: pnpm guard:keyboard
      - run: pnpm build
      # Chrome extension (MV3): 5MB package and 150KB popup, gzipped, as the popup loads it (rule 6,
      # E-06).
      - run: pnpm --filter @kamo/extension build
      - run: node scripts/check-size.ts 5 apps/extension/dist
      - run: node apps/extension/scripts/size-budget.ts
      # @kamo/mcp as npm ships it (D-019: 5MB).
      - name: '@kamo/mcp package size budget'
        run: |
          pnpm --filter @kamo/mcp build
          mkdir -p out-packed
          (cd apps/mcp && pnpm pack --pack-destination ../../out-packed)
          node scripts/check-size.ts 5 out-packed/*.tgz

  # Visual regression (AGENTS.md → Quality): frames rendered by core's renderer from the event
  # fixtures, compared with packages/core/fixtures/visual/*.png. On Windows, like the machine
  # the references are made on, so Skia's anti-aliasing matches. On a failure the actual,
  # expected and diff images are in the "visual-diff" artifact; for an intended change run
  # `pnpm visual:update` (or take the artifact's *.actual.png) and commit the new references.
  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: out-visual

  # Swift capture helper (D-023): must build with no warnings on the Mac runner.
  mac-helper:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release --package-path apps/desktop/native/mac --scratch-path apps/desktop/native/mac/build -Xswiftc -warnings-as-errors

  # Rust capture helper (D-023): formatted, no clippy warnings, unit tests, release build.
  win-helper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/native/win
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target-dir build -- -D warnings
      - run: cargo test --target-dir build
      - run: cargo build --release --target-dir build

  # Builds the installers on both OSes, opens the packaged app once and enforces the
  # 130MB installer budget (rule 6). Unsigned here; signing happens in the release workflow.
  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer: apps/desktop/release/*.exe
            binary: apps/desktop/release/win-unpacked/Kamo.exe
          - os: macos-14
            installer: apps/desktop/release/*.dmg
            binary: apps/desktop/release/mac-arm64/Kamo.app/Contents/MacOS/Kamo
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The capture helpers ship inside the app (extraResources in electron-builder.yml).
      - name: Build the Mac capture helper
        if: runner.os == 'macOS'
        run: swift build -c release --package-path apps/desktop/native/mac --scratch-path apps/desktop/native/mac/build
      - name: Build the Windows capture helper
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path apps/desktop/native/win/Cargo.toml --target-dir apps/desktop/native/win/build
      - run: pnpm --filter @kamo/desktop package
      - name: Installer size budget
        shell: bash
        run: node scripts/check-size.ts 130 ${{ matrix.installer }}
      - name: Smoke test (packaged app opens and renders)
        shell: bash
        run: ${{ matrix.binary }} --smoke-test
      # Export benchmark: a fixed sample project (apps/desktop/scripts/sample-project: ~19s,
      # 1920×1080, scripted clicks) exported for real at 1080p30 by the packaged app's export
      # smoke test. Runners have no GPU, so the numbers go to the job summary and only a gross
      # regression against scripts/export-benchmark-baseline.json fails the job.
      - name: 'Benchmark: write the sample project'
        id: sample
        shell: bash
        run: |
          pnpm --filter @kamo/desktop exec install-electron
          apps/desktop/node_modules/.bin/electron apps/desktop/scripts/sample-project --name "CI benchmark" | tee sample.log
          id=$(grep -oE '^project: +[0-9a-f-]{36}' sample.log | awk '{print $2}')
          echo "project=$id" >> "$GITHUB_OUTPUT"
      - name: 'Benchmark: export smoke on the packaged app'
        if: steps.sample.outputs.project != ''
        continue-on-error: true
        shell: bash
        env:
          KAMO_SMOKE_EXPORT: ${{ steps.sample.outputs.project }}
        run: |
          ${{ matrix.binary }} --smoke-test 2>&1 | tee export-smoke.log
          exit "${PIPESTATUS[0]}"
      - name: 'Benchmark: report'
        if: steps.sample.outputs.project != ''
        shell: bash
        run: node scripts/export-benchmark.ts export-smoke.log "$(node -p process.platform)"
