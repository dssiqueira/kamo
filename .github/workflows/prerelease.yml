name: Prerelease

# 0.0.x-next prereleases on every merge to main: kamo-site uses these packages from phase 0.
# Without the NPM_TOKEN secret (forks, or before the @kamo npm org exists) every step after
# the check is skipped and the run stays green.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'dssiqueira/kamo'
    permissions:
      contents: read
      id-token: write # npm provenance
    strategy:
      matrix:
        package: [design-tokens, core]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      # Only whether the secret exists reaches this step; the token itself is given to the
      # publish step alone, never to the install, the tests or a third-party action.
      - name: NPM_TOKEN present?
        id: token
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::NPM_TOKEN is not set; @kamo/$PACKAGE@next was not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
        if: steps.token.outputs.publish == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.token.outputs.publish == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.token.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.publish == 'true'
        run: pnpm test
      - name: Build @kamo/${{ matrix.package }}@next
        if: steps.token.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pnpm build
          npm pkg set version="0.0.$RUN_NUMBER-next"
      - name: Publish @kamo/${{ matrix.package }}@next
        if: steps.token.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --tag next --access public --no-git-checks --provenance --ignore-scripts
