name: Release

# A `v*` tag (e.g. v0.1.0, v0.1.0-beta.1) builds and signs the desktop app on macos-15 and
# windows-latest, builds the extension and collects everything into a DRAFT GitHub Release
# (installers, electron-updater's latest*.yml and blockmaps, the extension zip). A person
# reviews the draft and publishes it: only then does electron-updater offer it. npm packages
# and the Chrome Web Store go out from here too, each only when its secrets exist.
# Every secret is optional: without it the step is skipped with a warning, never a failure.
# Secrets and the manual checks per release: docs/release-checklist.md.
# Platforms: Windows always; Mac only when the repository variable RELEASE_MAC is "true"
# (Settings > Secrets and variables > Actions > Variables). Until then the Mac app is
# "coming soon" in the README and the release ships Windows only. The same goes for the
# Chrome extension: its zip and the Chrome Web Store upload need RELEASE_EXTENSION "true".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      mac: ${{ steps.platforms.outputs.mac }}
      desktop: ${{ steps.platforms.outputs.desktop }}
    steps:
      - name: Platforms in this release
        id: platforms
        env:
          RELEASE_MAC: ${{ vars.RELEASE_MAC }}
        run: |
          win='{"os":"windows-latest","binary":"apps/desktop/release/win-unpacked/Kamo.exe"}'
          mac='{"os":"macos-15","binary":"apps/desktop/release/mac-arm64/Kamo.app/Contents/MacOS/Kamo"}'
          if [ "$RELEASE_MAC" = true ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "desktop=[$mac,$win]" >> "$GITHUB_OUTPUT"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
            echo "desktop=[$win]" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_MAC is not true: this release builds Windows only."
          fi
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Kamo $version (prerelease: $prerelease)"

  # Same gate as CI, on the tagged commit.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    # bash on both runners: Windows defaults to PowerShell, where "$VERSION" is an empty
    # PowerShell variable instead of the environment variable.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # No dependency cache in the job that signs: a poisoned cache entry would run next to
        # the signing secrets.
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # electron-builder names the files and latest*.yml after package.json's version.
      - name: Set the app version
        working-directory: apps/desktop
        run: npm pkg set version="$VERSION"

      # The capture helpers ship inside the app (extraResources in electron-builder.yml).
      - name: Build the Mac capture helper
        if: runner.os == 'macOS'
        run: swift build -c release --package-path apps/desktop/native/mac --scratch-path apps/desktop/native/mac/build -Xswiftc -warnings-as-errors
      - name: Build the Windows capture helper
        if: runner.os == 'Windows'
        run: cargo build --locked --release --manifest-path apps/desktop/native/win/Cargo.toml --target-dir apps/desktop/native/win/build

      # Never KAMO_BUILD_CI_SMOKE here: a release ignores --smoke-test and every KAMO_SMOKE_*
      # hook (src/main/build-flags.ts). KAMO_BUILD_MCP_ON_NPM=1 only when this release also
      # publishes @kamo/mcp (the npm job below, which needs NPM_TOKEN): only then does Settings →
      # Connect to an agent offer `npx -y @kamo/mcp@<version>`. github-release checks that it
      # really is on npm before the draft is made.
      - name: Build the app
        env:
          KAMO_BUILD_MCP_ON_NPM: ${{ secrets.NPM_TOKEN != '' && '1' || '0' }}
        run: pnpm --filter @kamo/desktop build

      # Mac: Developer ID signing (hardened runtime, the helper included) and notarization by
      # electron-builder, which reads these variables. Each part is skipped on its own when its
      # secrets are missing.
      - name: Package (Mac, signed and notarized when the secrets exist)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # No certificate: identity null makes electron-builder skip signing on Mac (without it,
          # the hardened-runtime build fails looking for an identity).
          UNSIGNED=""
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            UNSIGNED="-c.mac.identity=null"
            echo "::warning::CSC_LINK is not set: the Mac app is NOT signed or notarized. Gatekeeper will block it; do not publish this draft for users."
          elif [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "::warning::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID is not set: the Mac app is signed but NOT notarized. Gatekeeper will warn users."
          fi
          pnpm exec electron-builder --mac --publish never $UNSIGNED

      # Windows: unsigned in v0.1 (docs/integrations.md → Distribution; users see SmartScreen).
      # A certificate in WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD signs it. The Mac CSC_LINK is never
      # exposed here: electron-builder would try it for Windows.
      - name: Package (Windows, signed when the secrets exist)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::WIN_CSC_LINK is not set: the Windows installer is unsigned (expected in v0.1; SmartScreen shows More info → Run anyway)."
          fi
          pnpm exec electron-builder --win --publish never

      - name: Installer size budget (rule 6)
        shell: bash
        run: |
          shopt -s nullglob
          installers=(apps/desktop/release/*.dmg apps/desktop/release/*.exe)
          [ ${#installers[@]} -gt 0 ] || { echo "::error::No installer in apps/desktop/release"; exit 1; }
          node scripts/check-size.ts 130 "${installers[@]}"
      # A release build has no --smoke-test (CI's packaged smoke test covers rendering): here the
      # app must start from its own app.asar, with the fuses flipped, and still be running after
      # 20s. A separate user-data folder keeps it away from anything on the runner.
      - name: Launch check (packaged app starts and keeps running)
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          "$BINARY" --user-data-dir="$RUNNER_TEMP/kamo-launch-check" > launch.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat launch.log
            echo "::error::The packaged app exited within 20s of starting"
            exit 1
          fi
          kill "$pid" || true
          cat launch.log
      - name: Check the Mac signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=apps/desktop/release/mac-arm64/Kamo.app
          details=$(codesign -dvv "$app" 2>&1 || true)
          if codesign --verify --deep --strict "$app" 2>/dev/null && [[ "$details" == *"Authority=Developer ID Application"* ]]; then
            echo "$details" | grep -E 'Authority=Developer|TeamIdentifier|flags' || true
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/helpers/mac/kamo-capture"
            if xcrun stapler validate "$app"; then
              spctl --assess --type execute --verbose=2 "$app"
            else
              echo "::warning::The Mac app is signed but has no notarization ticket."
            fi
          else
            echo "::warning::The Mac app has no Developer ID signature."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  extension:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The manifest takes its version from package.json (scripts/manifest.ts maps a
      # prerelease to Chrome's numeric `version` and keeps the full one in `version_name`).
      - name: Set the extension version
        working-directory: apps/extension
        run: npm pkg set version="$VERSION"
      - run: pnpm --filter @kamo/extension build
      - name: Extension size budget (rule 6)
        run: |
          node scripts/check-size.ts 5 apps/extension/dist
          node apps/extension/scripts/size-budget.ts
      - name: Zip
        run: |
          mkdir -p upload
          (cd apps/extension/dist && zip -r -X "$GITHUB_WORKSPACE/upload/kamo-extension-$VERSION.zip" .)
          node scripts/check-size.ts 5 "upload/kamo-extension-$VERSION.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: upload/kamo-extension-*.zip
          if-no-files-found: error

  # One job uploads everything, so the two desktop builds never race to create the release.
  # The release stays a draft: electron-updater only sees it once a person publishes it.
  github-release:
    needs: [prepare, check, desktop, extension, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      MAC: ${{ needs.prepare.outputs.mac }}
      EXTENSION: ${{ vars.RELEASE_EXTENSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: The update feeds of this release's platforms are there
        run: |
          ls -la assets
          test -f assets/latest.yml || { echo "::error::latest.yml (Windows) missing"; exit 1; }
          if [ "$MAC" = true ]; then
            test -f assets/latest-mac.yml || { echo "::error::latest-mac.yml (Mac) missing"; exit 1; }
          fi
      # The app built with NPM_TOKEN present tells users to run `npx -y @kamo/mcp@<version>`:
      # that exact version must be on npm before anyone can download the app.
      - name: '@kamo/mcp is on npm when the app advertises it'
        env:
          MCP_ON_NPM: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$MCP_ON_NPM" != true ]; then
            echo "::notice::No NPM_TOKEN: this app shows no npx command, only the note that @kamo/mcp is not published yet."
            exit 0
          fi
          if ! npm view "@kamo/mcp@$VERSION" version; then
            echo "::error::The app offers npx -y @kamo/mcp@$VERSION, but that version is not on npm."
            exit 1
          fi
      - name: Create or update the draft release
        run: |
          # Hand-written notes in docs/releases/v<version>.md when there are some (CHANGELOG.md
          # links them); otherwise GitHub's generated list of changes.
          notes="docs/releases/v$VERSION.md"
          if [ -f "$notes" ]; then
            flags=(--draft --verify-tag --title "Kamo $VERSION" --notes-file "$notes")
          else
            flags=(--draft --verify-tag --title "Kamo $VERSION" --generate-notes)
          fi
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
          else
            gh release create "$TAG" "${flags[@]}"
          fi
          # The extension is "coming soon": its zip stays out until RELEASE_EXTENSION is "true".
          if [ "$EXTENSION" != true ]; then
            rm -f assets/kamo-extension-*.zip
            echo "::notice::RELEASE_EXTENSION is not true: the extension zip is left out of the release."
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'

  # After the builds: a release that failed anywhere publishes nothing to npm.
  npm:
    needs: [prepare, check, desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only whether the secret exists reaches this step; the token itself is given to the
      # publish step alone, never to the install, the build or a third-party action.
      - name: NPM_TOKEN present?
        id: token
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::NPM_TOKEN is not set: npm packages were not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
        if: steps.token.outputs.publish == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.token.outputs.publish == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.token.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build @kamo/design-tokens, i18n, core, cloud-client and mcp at this version
        if: steps.token.outputs.publish == 'true'
        run: |
          for dir in packages/design-tokens packages/i18n packages/core packages/cloud-client apps/mcp; do
            (cd "$dir" && npm pkg set version="$VERSION" && pnpm build)
          done
      # Dependencies first: `workspace:*` becomes this exact version on publish, so @kamo/core
      # must be on npm before @kamo/mcp. A version already on npm is skipped (re-runs).
      - name: Publish @kamo/design-tokens, i18n, core, cloud-client and mcp
        if: steps.token.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          tag=latest
          [ "$PRERELEASE" = true ] && tag=next
          for dir in packages/design-tokens packages/i18n packages/core packages/cloud-client apps/mcp; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm; skipping."
              continue
            fi
            echo "::group::$name@$VERSION ($tag)"
            (cd "$dir" && pnpm publish --access public --tag "$tag" --provenance --no-git-checks --ignore-scripts)
            echo "::endgroup::"
          done
      - name: '@kamo/mcp size budget (D-019: 5MB)'
        if: steps.token.outputs.publish == 'true'
        run: |
          mkdir -p packed
          (cd apps/mcp && pnpm pack --pack-destination ../../packed)
          node scripts/check-size.ts 5 packed/*.tgz

  # Chrome Web Store API v2 (scripts/chrome-web-store.ts): uploads the same zip as the
  # release asset and submits it for review. Stable tags only; skipped without the secrets.
  chrome-web-store:
    needs: [prepare, github-release]
    if: needs.prepare.outputs.prerelease == 'false' && vars.RELEASE_EXTENSION == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only whether each secret exists reaches this step; the values go to the upload step alone.
      - name: Chrome Web Store secrets present?
        id: secrets
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID != '' }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID != '' }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID != '' }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET != '' }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
        run: |
          missing=""
          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            [ "${!name}" != true ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not uploaded to the Chrome Web Store; missing secrets:$missing. Upload the release's extension zip by hand."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
        if: steps.secrets.outputs.upload == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.upload == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.upload == 'true'
        with:
          name: extension
          path: upload
      - name: Upload and submit for review
        if: steps.secrets.outputs.upload == 'true'
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/chrome-web-store.ts "upload/kamo-extension-$VERSION.zip"
