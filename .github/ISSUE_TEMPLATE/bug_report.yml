name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please check that a similar issue doesn't exist yet.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Kamo
        2. Pick a display and press Record
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app (Windows)
        - Desktop app (Mac)
        - Chrome extension
        - Local MCP server
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the app, open Settings → Help → **Copy diagnostics** and paste it here. It contains technical details only (versions, OS, GPU, permissions, recent errors), never your recordings or project names.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a short screen recording help a lot.
