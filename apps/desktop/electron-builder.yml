# Installers (docs/integrations.md → Distribution). Budget: ≤ 130MB each (rule 6).
appId: app.kamo.desktop
productName: Kamo
copyright: Copyright © 2026 Kamo contributors

directories:
  output: release
  buildResources: build

# Everything is bundled by electron-vite into out/; no node_modules ship with the app.
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
# Only the languages Kamo supports; Electron ships ~50 locale packs otherwise.
electronLanguages: [en, en-US, pt-BR, es, es-419, zh-CN, ja, de, fr, ko]

# Electron fuses, flipped in the binary before signing. Kamo holds the Screen Recording,
# Microphone and Camera grants on Mac, so no other process may run its own code as Kamo:
# no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS / NODE_EXTRA_CA_CERTS, no --inspect, and only the
# app.asar that was packaged (its hash is embedded and checked on load). Dev runs
# (`electron-vite dev`, node_modules/.bin/electron) use the stock binary and are not affected.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Still on: the pages load from file:// inside app.asar (src/main/windows.ts), and with it
  # off they fail with ERR_FILE_NOT_FOUND. Turn it off once they move to a custom scheme.
  grantFileProtocolExtraPrivileges: true

mac:
  target:
    - target: dmg
      arch: arm64
    # electron-updater installs from the zip on Mac, not the dmg (F-14).
    - target: zip
      arch: arm64
  category: public.app-category.video
  hardenedRuntime: true
  # The hardened runtime blocks the microphone and the camera without these entitlements.
  # Screen Recording needs none: macOS asks through its own prompt.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # What macOS shows in its permission prompts (F-04 microphone, A-03 webcam).
  extendInfo:
    NSMicrophoneUsageDescription: Kamo records your voice and your computer's sound with the screen recording, only when you turn them on.
    NSCameraUsageDescription: Kamo shows your webcam in a bubble on the screen recording, only when you turn it on.
  # Capture helper (D-023), built by `swift build` before packaging (native/mac/README.md).
  # It must be signed with the app and the hardened runtime in step 10.
  extraResources:
    - from: native/mac/build/release/kamo-capture
      to: helpers/mac/kamo-capture
    # whisper.cpp's CLI for local transcription (D-042), built by native/whisper/build.mjs;
    # signed with the app like the helper. The models are downloaded by the app, never here.
    - from: native/whisper/build/mac
      to: whisper
    # Settings → About → Third-party notices.
    - from: ../../THIRD_PARTY_NOTICES
      to: THIRD_PARTY_NOTICES
    # The menu bar icon (close to tray, F-15): the monochrome template only, a few KB.
    - from: build/tray
      to: tray
      filter: ['trayTemplate*.png']
  # Signing (Developer ID, every binary in the bundle including the helper) and notarization
  # come from the environment: CSC_LINK/CSC_KEY_PASSWORD and APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
  # APPLE_TEAM_ID in .github/workflows/release.yml. Without them (CI, forks) the build sets
  # CSC_IDENTITY_AUTO_DISCOVERY=false and stays unsigned.

dmg:
  artifactName: Kamo-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: x64
  # Capture helper (D-023), built by `cargo build --release` before packaging
  # (native/win/README.md).
  extraResources:
    - from: native/win/build/release/kamo-capture.exe
      to: helpers/win/kamo-capture.exe
    # whisper.cpp's CLI, its ggml DLLs and the C++ runtime they need (D-042), built by
    # native/whisper/build.mjs.
    - from: native/whisper/build/win
      to: whisper
    # Settings → About → Third-party notices.
    - from: ../../THIRD_PARTY_NOTICES
      to: THIRD_PARTY_NOTICES
    # The tray icon (close to tray, F-15): the colour one at 100%–300% scaling, a few KB.
    - from: build/tray
      to: tray
      filter: ['tray.png', 'tray@*.png']

# Microsoft Store package (MSIX), built only by .github/workflows/store.yml with
# `--win appx`; the release workflow keeps shipping the NSIS installer. The identity
# (identityName, publisher, publisherDisplayName) comes from Partner Center and is passed on
# the command line from repository variables. The Store signs the package and updates the app.
appx:
  applicationId: Kamo
  displayName: Kamo
  backgroundColor: '#FAF7F2'
  # Electron apps run as full trust; the microphone and the webcam need their capabilities
  # declared or Windows never asks for them inside a package.
  capabilities: [runFullTrust, microphone, webcam]
  languages: [en-US, pt-BR, es-ES, zh-CN, ja-JP, de-DE, fr-FR, ko-KR]
  # Electron 45 needs Windows 10 1809 or later.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: Kamo-${version}-store-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Kamo-${version}-win-${arch}-setup.${ext}

# Automatic updates read the GitHub Releases feed (F-14). The package script still passes
# --publish never; the release workflow publishes.
publish:
  provider: github
  owner: dssiqueira
  repo: kamo
