# Windows capture helper (D-023): Windows Graphics Capture + Media Foundation, spoken to over
# stdio by the Electron main process (apps/desktop/src/main/capture/PROTOCOL.md).
[package]
name = "kamo-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Kamo's Windows screen capture helper"

[[bin]]
name = "kamo-capture"
path = "src/main.rs"

[dependencies]
# serde + serde_json: the stdio protocol is JSON Lines (PROTOCOL.md). Hand-rolled JSON parsing
# would be more code and more bugs than these two small, ubiquitous crates.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
# windows: Microsoft's official bindings for every OS API used here (WGC, D3D11, Media
# Foundation, WIC, the mouse hook). Only the features below are compiled in.
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# Small binary (AGENTS.md rule 6): the OS does the heavy lifting, so size beats speed here.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Safe: no unwinding is relied on anywhere, and a panic hook reports it on stdout first.
panic = "abort"
